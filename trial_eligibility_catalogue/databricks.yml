# This is a Databricks asset bundle definition for trial_eligibility_catalogue.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: trial_eligibility_catalogue
  uuid: 9de0b157-bcc4-45de-ac4f-2584163b1992

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-0cb6fbee-f9df.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-0cb6fbee-f9df.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/steffhoremans@yahoo.com to make sure we only have a single copy.
      root_path: /Workspace/Users/steffhoremans@yahoo.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: steffhoremans@yahoo.com
        level: CAN_MANAGE
